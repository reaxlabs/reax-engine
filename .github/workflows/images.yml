name: images

on:
  push:
    branches: [main, "fusion/engine-composite-open-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # CPU-only unit tests (fake backends, fake vLLM server); no GPU, no model weights.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest uvicorn aiohttp numpy
      - run: python -m pytest -q tests

  s1-fast:
    # Builds docker/s1-fast/Dockerfile and pushes it to GHCR on version tags and manual runs.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/reaxlabs/reax-engine-s1-fast
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          short="sha-$(git rev-parse --short=7 HEAD)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then main="${GITHUB_REF_NAME}"; else main="${short}"; fi
          {
            echo "list<<EOF"
            echo "${IMAGE}:${short}"
            [ "${main}" != "${short}" ] && echo "${IMAGE}:${main}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/s1-fast/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
      - name: Pushed digest
        run: |
          {
            echo "### reax-engine-s1-fast"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Pull by digest: \`${IMAGE}@${{ steps.push.outputs.digest }}\`"
            echo
            echo "Tags:"
            echo '${{ steps.tags.outputs.list }}' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  ref:
    # Engine track v2 reference images (one per production model, see docs/ENGINE-TRACK-V2-REFERENCE.md): built on version tags,
    # manual runs and pushes of the engine-composite-open branches. The qwen35 image serves d3-turbo, pplx and REAX 1 and is
    # published under the three slot names with ONE digest.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fusion/engine-composite-open-'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: qwen35
            file: docker/ref-qwen35/Dockerfile
            names: "d3turbo pplx reax1"
          - id: blink
            file: docker/ref-blink/Dockerfile
            names: "blink"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (the images are 8-12 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          short="sha-$(git rev-parse --short=7 HEAD)"
          {
            echo "list<<EOF"
            for n in ${{ matrix.names }}; do
              echo "ghcr.io/reaxlabs/reax-engine-ref-${n}:${short}"
              [ "${GITHUB_REF_TYPE}" = tag ] && echo "ghcr.io/reaxlabs/reax-engine-ref-${n}:${GITHUB_REF_NAME}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.list }}
      - name: Pushed digest
        run: |
          {
            echo "### reference image ${{ matrix.id }} (${{ matrix.names }})"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Source commit: \`${{ github.sha }}\`"
            echo
            echo "Tags:"
            echo '${{ steps.tags.outputs.list }}' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DIGEST ${{ matrix.id }} ${{ matrix.names }} ${{ steps.push.outputs.digest }}"
